name: HarvestHub CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  backend:
    name: Build Spring Boot Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: harvest-hub

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build Backend
        run: bash mvnw clean package -DskipTests

  frontend:
    name: Build Angular Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: harvest-hub-frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: harvest-hub-frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build
